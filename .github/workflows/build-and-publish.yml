name: Build and Publish a Docker image

on:
  push:
    branches: ['main']

env:
#  REGISTRY: ghcr.io
  IMAGE_NAME: taskyfabrizia
  AKS_CLUSTER_NAME: fabwizia-k8s
  AKS_RESOURCE_GROUP: Application_Tier2

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}
  
#      - name: Azure ACR Login
#        uses: azure/docker-login@v1
#        with:
#          login-server: ${{ secrets.ACR_NAME }}
#          username: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
#          password: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}

#      - name: Ensure ACR is attached to AKS
#        run: |
#          az aks update --name ${{ env.AKS_CLUSTER_NAME }} --resource-group ${{ env.AKS_RESOURCE_GROUP }} --attach-acr ${{ secrets.ACR_NAME }}
  
      - name: Deploy to AKS
        run: |
          kubectl apply -f deployment.yaml
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/deploy-tasky
          kubectl get services tasky-fabrizia-service

  cis-benchmark-audit:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}
          
      - name: Clone CIS Benchmarks Audit tool
        run: |
          git clone https://github.com/finalduty/cis-benchmarks-audit.git
          cd cis-benchmarks-audit
          
      - name: Install dependencies
        run: |
          cd cis-benchmarks-audit
          # Install any required dependencies (check the repo's README for specifics)
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          
      - name: Run CIS Benchmark Audit
        run: |
          cd cis-benchmarks-audit
          # Run the audit against your AKS cluster
          # Adjust the command based on the tool's documentation
          python3 audit.py --target kubernetes --output-format json > cis-audit-results.json
        continue-on-error: true  # Don't fail the workflow if audit finds issues
        
      - name: Upload CIS Audit Results
        uses: actions/upload-artifact@v4
        with:
          name: cis-audit-results
          path: cis-benchmarks-audit/cis-audit-results.json
          
      - name: Display Audit Summary
        run: |
          cd cis-benchmarks-audit
          echo "CIS Benchmark Audit Summary:"
          if [ -f cis-audit-results.json ]; then
            # Basic summary - adjust based on the tool's output format
            cat cis-audit-results.json | head -20
          else
            echo "No audit results file found"
          fi

