name: Build and Publish a Docker image

on:
  push:
    branches: ['main']

env:
  IMAGE_NAME: taskyfabrizia
  AKS_CLUSTER_NAME: fabwizia-k8s
  AKS_RESOURCE_GROUP: Application_Tier2

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}
  
#      - name: Azure ACR Login
#        uses: azure/docker-login@v1
#        with:
#          login-server: ${{ secrets.ACR_NAME }}
#          username: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
#          password: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}

#      - name: Ensure ACR is attached to AKS
#        run: |
#          az aks update --name ${{ env.AKS_CLUSTER_NAME }} --resource-group ${{ env.AKS_RESOURCE_GROUP }} --attach-acr ${{ secrets.ACR_NAME }}
  
      - name: Deploy to AKS
        run: |
          kubectl apply -f deployment.yaml
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/deploy-tasky
          kubectl get services tasky-fabrizia-service

  kubernetes-cis-benchmark:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}
          
      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes
          
      - name: Create kube-bench job manifest
        run: |
          cat > kube-bench-job.yaml << 'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: kube-bench
          spec:
            template:
              spec:
                hostPID: true
                nodeSelector:
                  kubernetes.io/os: linux
                tolerations:
                - key: node-role.kubernetes.io/master
                  operator: Exists
                  effect: NoSchedule
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
                containers:
                - name: kube-bench
                  image: aquasec/kube-bench:latest
                  command: ["kube-bench"]
                  args: ["--benchmark", "aks-1.0", "--json"]
                  volumeMounts:
                  - name: var-lib-etcd
                    mountPath: /var/lib/etcd
                    readOnly: true
                  - name: var-lib-kubelet
                    mountPath: /var/lib/kubelet
                    readOnly: true
                  - name: var-lib-kube-scheduler
                    mountPath: /var/lib/kube-scheduler
                    readOnly: true
                  - name: var-lib-kube-controller-manager
                    mountPath: /var/lib/kube-controller-manager
                    readOnly: true
                  - name: etc-systemd
                    mountPath: /etc/systemd
                    readOnly: true
                  - name: lib-systemd
                    mountPath: /lib/systemd/
                    readOnly: true
                  - name: srv-kubernetes
                    mountPath: /srv/kubernetes/
                    readOnly: true
                  - name: etc-kubernetes
                    mountPath: /etc/kubernetes
                    readOnly: true
                  - name: usr-bin
                    mountPath: /usr/local/mount-from-host/bin
                    readOnly: true
                  - name: etc-cni-netd
                    mountPath: /etc/cni/net.d/
                    readOnly: true
                  - name: opt-cni-bin
                    mountPath: /opt/cni/bin/
                    readOnly: true
                restartPolicy: Never
                volumes:
                - name: var-lib-etcd
                  hostPath:
                    path: "/var/lib/etcd"
                - name: var-lib-kubelet
                  hostPath:
                    path: "/var/lib/kubelet"
                - name: var-lib-kube-scheduler
                  hostPath:
                    path: "/var/lib/kube-scheduler"
                - name: var-lib-kube-controller-manager
                  hostPath:
                    path: "/var/lib/kube-controller-manager"
                - name: etc-systemd
                  hostPath:
                    path: "/etc/systemd"
                - name: lib-systemd
                  hostPath:
                    path: "/lib/systemd"
                - name: srv-kubernetes
                  hostPath:
                    path: "/srv/kubernetes"
                - name: etc-kubernetes
                  hostPath:
                    path: "/etc/kubernetes"
                - name: usr-bin
                  hostPath:
                    path: "/usr/bin"
                - name: etc-cni-netd
                  hostPath:
                    path: "/etc/cni/net.d/"
                - name: opt-cni-bin
                  hostPath:
                    path: "/opt/cni/bin/"
          EOF
          
      - name: Run kube-bench CIS audit
        run: |
          kubectl apply -f kube-bench-job.yaml
          echo "Waiting for kube-bench job to complete..."
          kubectl wait --for=condition=complete job/kube-bench --timeout=300s
          POD_NAME=$(kubectl get pods --selector=job-name=kube-bench --output=jsonpath='{.items[0].metadata.name}')
          echo "kube-bench pod: $POD_NAME"
          kubectl logs $POD_NAME > kube-bench-results.json
        continue-on-error: true
        
      - name: Process and display top 10 CIS benchmark results
        run: |
          if [ -f kube-bench-results.json ]; then
            echo "=== Top 10 CIS Benchmark Results ==="
            echo ""
            
            # Create a script to parse JSON and create table
            cat > parse_results.py << 'EOF'
          import json
          import sys
          import re
          
          def parse_kube_bench_results(filename):
              try:
                  with open(filename, 'r') as f:
                      content = f.read()
                  
                  # Print first few lines to debug
                  print("=== Debug: First 10 lines of output ===")
                  lines = content.split('\n')
                  for i, line in enumerate(lines[:10]):
                      print(f"{i+1}: {line}")
                  print("=== End Debug ===\n")
                  
                  # Try to parse as JSON
                  data = None
                  try:
                      data = json.loads(content)
                  except json.JSONDecodeError:
                      # If not valid JSON, try to extract JSON from mixed output
                      print("Initial JSON parsing failed, trying to extract JSON...")
                      
                      # Look for JSON block in the output
                      json_start = -1
                      json_end = -1
                      brace_count = 0
                      
                      for i, line in enumerate(lines):
                          stripped = line.strip()
                          if stripped.startswith('{') and json_start == -1:
                              json_start = i
                              brace_count = stripped.count('{') - stripped.count('}')
                          elif json_start != -1:
                              brace_count += stripped.count('{') - stripped.count('}')
                              if brace_count == 0:
                                  json_end = i
                                  break
                      
                      if json_start != -1 and json_end != -1:
                          json_content = '\n'.join(lines[json_start:json_end+1])
                          try:
                              data = json.loads(json_content)
                              print("Successfully extracted JSON from mixed output")
                          except json.JSONDecodeError as e:
                              print(f"Failed to parse extracted JSON: {e}")
                      
                      if data is None:
                          print("Could not extract valid JSON, trying line-by-line parsing...")
                          # Last resort: try to find any JSON objects line by line
                          for line in lines:
                              if line.strip().startswith('{'):
                                  try:
                                      data = json.loads(line.strip())
                                      print("Found JSON object in single line")
                                      break
                                  except:
                                      continue
                  
                  if data is None:
                      print("Could not parse JSON from output")
                      return
                  
                  print(f"=== Parsed JSON structure ===")
                  print(f"Top-level keys: {list(data.keys()) if isinstance(data, dict) else 'Not a dict'}")
                  
                  # Extract all test results - handle different kube-bench formats
                  all_results = []
                  
                  # Try different possible structures
                  controls = data.get('Controls', [])
                  if not controls and 'controls' in data:
                      controls = data['controls']
                  
                  for control in controls:
                      print(f"Processing control: {control.get('id', 'unknown')}")
                      
                      tests = control.get('tests', [])
                      if not tests and 'Tests' in control:
                          tests = control['Tests']
                      
                      for test in tests:
                          results = test.get('results', [])
                          if not results and 'Results' in test:
                              results = test['Results']
                          
                          for result in results:
                              # Handle different field names that kube-bench uses
                              test_number = (result.get('test_number') or 
                                           result.get('TestNumber') or 
                                           result.get('id') or 
                                           result.get('test_id') or 'N/A')
                              
                              test_desc = (result.get('test_desc') or 
                                         result.get('TestDesc') or 
                                         result.get('description') or 
                                         result.get('desc') or 'N/A')
                              
                              test_result = (result.get('result') or 
                                           result.get('Result') or 
                                           result.get('status') or 
                                           result.get('Status') or 'UNKNOWN')
                              
                              scored = result.get('scored', result.get('Scored', True))
                              
                              # Determine severity
                              severity = "INFO"
                              if test_result.upper() == 'FAIL':
                                  severity = "HIGH"
                              elif test_result.upper() == 'WARN':
                                  severity = "MEDIUM"
                              elif test_result.upper() == 'PASS':
                                  severity = "LOW"
                              
                              # Truncate description
                              if len(str(test_desc)) > 80:
                                  test_desc = str(test_desc)[:80] + "..."
                              
                              all_results.append({
                                  'test_number': str(test_number),
                                  'test_desc': str(test_desc),
                                  'result': str(test_result).upper(),
                                  'severity': severity,
                                  'scored': scored
                              })
                  
                  print(f"Found {len(all_results)} total test results")
                  
                  if not all_results:
                      print("No test results found in the parsed data")
                      print("Available data structure:")
                      print(json.dumps(data, indent=2)[:1000] + "..." if len(json.dumps(data, indent=2)) > 1000 else json.dumps(data, indent=2))
                      return
                  
                  # Sort by severity (FAIL first, then WARN, then others) and limit to top 10
                  priority_order = {'FAIL': 0, 'WARN': 1, 'PASS': 2, 'INFO': 3, 'UNKNOWN': 4}
                  all_results.sort(key=lambda x: (priority_order.get(x['result'], 5), x['test_number']))
                  top_results = all_results[:10]
                  
                  # Print table header
                  print("\n=== Top 10 CIS Benchmark Results ===")
                  print("| Test # | Result | Severity | Description |")
                  print("|--------|--------|----------|-------------|")
                  
                  # Print top 10 results
                  for result in top_results:
                      test_num = result['test_number'][:8]  # Limit width
                      test_result = result['result'][:6]
                      severity = result['severity'][:8]
                      description = result['test_desc']
                      
                      print(f"| {test_num:<8} | {test_result:<6} | {severity:<8} | {description} |")
                  
                  # Print summary
                  print("\n=== Summary ===")
                  fail_count = sum(1 for r in all_results if r['result'] == 'FAIL')
                  warn_count = sum(1 for r in all_results if r['result'] == 'WARN')
                  pass_count = sum(1 for r in all_results if r['result'] == 'PASS')
                  info_count = sum(1 for r in all_results if r['result'] == 'INFO')
                  unknown_count = sum(1 for r in all_results if r['result'] == 'UNKNOWN')
                  
                  print(f"Total Tests: {len(all_results)}")
                  print(f"Failed: {fail_count}")
                  print(f"Warnings: {warn_count}")
                  print(f"Passed: {pass_count}")
                  print(f"Info: {info_count}")
                  print(f"Unknown: {unknown_count}")
                  
              except Exception as e:
                  print(f"Error parsing results: {str(e)}")
                  import traceback
                  traceback.print_exc()
                  print("\nRaw output (first 50 lines):")
                  try:
                      with open(filename, 'r') as f:
                          lines = f.readlines()
                          for i, line in enumerate(lines[:50]):
                              print(f"{i+1}: {line.rstrip()}")
                  except Exception as file_error:
                      print(f"Could not read file: {file_error}")
          
          if __name__ == "__main__":
              parse_kube_bench_results('kube-bench-results.json')
          EOF
            
            # Run the parser
            python3 parse_results.py
            
          else
            echo "No kube-bench results found"
          fi
          
      - name: Upload CIS Audit Results
        uses: actions/upload-artifact@v4
        with:
          name: kube-bench-cis-results
          path: kube-bench-results.json
          
      - name: Cleanup
        run: kubectl delete job kube-bench --ignore-not-found=true
        if: always()

  secrets-scan:
    runs-on: ubuntu-latest
    needs: kubernetes-cis-benchmark
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and run TruffleHog directly
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/trufflesecurity/trufflehog/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/${LATEST_VERSION}/trufflehog_${LATEST_VERSION#v}_linux_amd64.tar.gz" | tar -xz
          # Scan filesystem directly - this will catch all hardcoded secrets
          pwd
          ls -R
          ./trufflehog filesystem . --no-verification --json --debug
          
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --debug --json --no-verification


