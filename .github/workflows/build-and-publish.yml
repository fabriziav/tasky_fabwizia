name: Build and Publish a Docker image

on:
  push:
    branches: ['main']

env:
#  REGISTRY: ghcr.io
  IMAGE_NAME: taskyfabrizia
  AKS_CLUSTER_NAME: fabwizia-k8s
  AKS_RESOURCE_GROUP: Application_Tier2

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}
  
#      - name: Azure ACR Login
#        uses: azure/docker-login@v1
#        with:
#          login-server: ${{ secrets.ACR_NAME }}
#          username: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
#          password: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}

#      - name: Ensure ACR is attached to AKS
#        run: |
#          az aks update --name ${{ env.AKS_CLUSTER_NAME }} --resource-group ${{ env.AKS_RESOURCE_GROUP }} --attach-acr ${{ secrets.ACR_NAME }}
  
      - name: Deploy to AKS
        run: |
          kubectl apply -f deployment.yaml
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/deploy-tasky
          kubectl get services tasky-fabrizia-service

  kubernetes-cis-benchmark:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}
          
      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes
          
      - name: Create kube-bench job manifest
        run: |
          cat > kube-bench-job.yaml << 'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: kube-bench
          spec:
            template:
              spec:
                hostPID: true
                nodeSelector:
                  kubernetes.io/os: linux
                tolerations:
                - key: node-role.kubernetes.io/master
                  operator: Exists
                  effect: NoSchedule
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
                containers:
                - name: kube-bench
                  image: aquasec/kube-bench:latest
                  command: ["kube-bench"]
                  args: ["--benchmark", "aks-1.0", "--json"]
                  volumeMounts:
                  - name: var-lib-etcd
                    mountPath: /var/lib/etcd
                    readOnly: true
                  - name: var-lib-kubelet
                    mountPath: /var/lib/kubelet
                    readOnly: true
                  - name: var-lib-kube-scheduler
                    mountPath: /var/lib/kube-scheduler
                    readOnly: true
                  - name: var-lib-kube-controller-manager
                    mountPath: /var/lib/kube-controller-manager
                    readOnly: true
                  - name: etc-systemd
                    mountPath: /etc/systemd
                    readOnly: true
                  - name: lib-systemd
                    mountPath: /lib/systemd/
                    readOnly: true
                  - name: srv-kubernetes
                    mountPath: /srv/kubernetes/
                    readOnly: true
                  - name: etc-kubernetes
                    mountPath: /etc/kubernetes
                    readOnly: true
                  - name: usr-bin
                    mountPath: /usr/local/mount-from-host/bin
                    readOnly: true
                  - name: etc-cni-netd
                    mountPath: /etc/cni/net.d/
                    readOnly: true
                  - name: opt-cni-bin
                    mountPath: /opt/cni/bin/
                    readOnly: true
                restartPolicy: Never
                volumes:
                - name: var-lib-etcd
                  hostPath:
                    path: "/var/lib/etcd"
                - name: var-lib-kubelet
                  hostPath:
                    path: "/var/lib/kubelet"
                - name: var-lib-kube-scheduler
                  hostPath:
                    path: "/var/lib/kube-scheduler"
                - name: var-lib-kube-controller-manager
                  hostPath:
                    path: "/var/lib/kube-controller-manager"
                - name: etc-systemd
                  hostPath:
                    path: "/etc/systemd"
                - name: lib-systemd
                  hostPath:
                    path: "/lib/systemd"
                - name: srv-kubernetes
                  hostPath:
                    path: "/srv/kubernetes"
                - name: etc-kubernetes
                  hostPath:
                    path: "/etc/kubernetes"
                - name: usr-bin
                  hostPath:
                    path: "/usr/bin"
                - name: etc-cni-netd
                  hostPath:
                    path: "/etc/cni/net.d/"
                - name: opt-cni-bin
                  hostPath:
                    path: "/opt/cni/bin/"
          EOF
          
      - name: Run kube-bench CIS audit
        run: |
          kubectl apply -f kube-bench-job.yaml
          echo "Waiting for kube-bench job to complete..."
          kubectl wait --for=condition=complete job/kube-bench --timeout=300s
          POD_NAME=$(kubectl get pods --selector=job-name=kube-bench --output=jsonpath='{.items[0].metadata.name}')
          echo "kube-bench pod: $POD_NAME"
          kubectl logs $POD_NAME > kube-bench-results.json
        continue-on-error: true
        
      - name: Process and display results
        run: |
          if [ -f kube-bench-results.json ]; then
            echo "=== Kube-bench CIS Audit Results Summary ==="
            
            # Create a simple Python script to parse and display results in table format
            cat > parse_results.py << 'PYEOF'
import json
import sys

try:
    with open('kube-bench-results.json', 'r') as f:
        content = f.read().strip()
    
    # Try to find JSON content in the output
    lines = content.split('\n')
    json_content = ""
    
    for line in lines:
        if line.strip().startswith('{'):
            # Found start of JSON, take everything from here
            idx = lines.index(line)
            json_content = '\n'.join(lines[idx:])
            break
    
    if json_content:
        try:
            data = json.loads(json_content)
            
            # Display overall summary
            totals = data.get('Totals', {})
            print("Overall Summary:")
            print("=" * 50)
            print(f"Total Pass: {totals.get('total_pass', 0)}")
            print(f"Total Fail: {totals.get('total_fail', 0)}")
            print(f"Total Warn: {totals.get('total_warn', 0)}")
            print(f"Total Info: {totals.get('total_info', 0)}")
            print()
            
            # Display top 10 results in table format
            print("Top 10 Test Results:")
            print("=" * 80)
            print(f"{'Status':<8} {'Test ID':<12} {'Description'}")
            print("-" * 80)
            
            count = 0
            for control in data.get('Controls', []):
                if count >= 10:
                    break
                for test in control.get('tests', []):
                    if count >= 10:
                        break
                    for result in test.get('results', []):
                        if count >= 10:
                            break
                        
                        status = result.get('status', 'N/A')
                        test_number = result.get('test_number', 'N/A')
                        description = result.get('test_desc', 'N/A')
                        
                        # Truncate description if too long
                        if len(description) > 50:
                            description = description[:47] + "..."
                        
                        # Color coding for status
                        if status == 'PASS':
                            status_display = "✅ PASS"
                        elif status == 'FAIL':
                            status_display = "❌ FAIL"
                        elif status == 'WARN':
                            status_display = "⚠️  WARN"
                        else:
                            status_display = f"ℹ️  {status}"
                        
                        print(f"{status_display:<8} {test_number:<12} {description}")
                        count += 1
            
            if count == 0:
                print("No test results found in the expected format")
                
        except json.JSONDecodeError as e:
            print(f"Could not parse JSON: {e}")
            print("Raw output (first 20 lines):")
            print('\n'.join(lines[:20]))
    else:
        print("No JSON content found. Raw output (first 20 lines):")
        print('\n'.join(lines[:20]))
        
except Exception as e:
    print(f"Error processing results: {e}")
    print("Raw file content (first 20 lines):")
    with open('kube-bench-results.json', 'r') as f:
        lines = f.readlines()
        for i, line in enumerate(lines[:20]):
            print(f"{i+1}: {line.rstrip()}")
PYEOF
            
            python3 parse_results.py
            
            echo ""
            echo "Complete results saved to artifact for detailed analysis"
          else
            echo "No kube-bench results found"
          fi
          
      - name: Upload CIS Audit Results
        uses: actions/upload-artifact@v4
        with:
          name: kube-bench-cis-results
          path: kube-bench-results.json
          
      - name: Cleanup
        run: kubectl delete job kube-bench --ignore-not-found=true
        if: always()
