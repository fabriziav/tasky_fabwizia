name: Build and Publish a Docker image

on:
  push:
    branches: ['main']

env:
#  REGISTRY: ghcr.io
  IMAGE_NAME: taskyfabrizia
  AKS_CLUSTER_NAME: fabwizia-k8s
  AKS_RESOURCE_GROUP: Application_Tier2

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}
  
#      - name: Azure ACR Login
#        uses: azure/docker-login@v1
#        with:
#          login-server: ${{ secrets.ACR_NAME }}
#          username: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
#          password: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}

#      - name: Ensure ACR is attached to AKS
#        run: |
#          az aks update --name ${{ env.AKS_CLUSTER_NAME }} --resource-group ${{ env.AKS_RESOURCE_GROUP }} --attach-acr ${{ secrets.ACR_NAME }}
  
      - name: Deploy to AKS
        run: |
          kubectl apply -f deployment.yaml
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/deploy-tasky
          kubectl get services tasky-fabrizia-service

  kubernetes-cis-benchmark:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }}
          
      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes
          
      - name: Create kube-bench job manifest
        run: |
          cat > kube-bench-job.yaml << 'EOF'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: kube-bench
          spec:
            template:
              spec:
                hostPID: true
                nodeSelector:
                  kubernetes.io/os: linux
                tolerations:
                - key: node-role.kubernetes.io/master
                  operator: Exists
                  effect: NoSchedule
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
                containers:
                - name: kube-bench
                  image: aquasec/kube-bench:latest
                  command: ["kube-bench"]
                  args: ["--benchmark", "aks-1.0", "--json"]
                  volumeMounts:
                  - name: var-lib-etcd
                    mountPath: /var/lib/etcd
                    readOnly: true
                  - name: var-lib-kubelet
                    mountPath: /var/lib/kubelet
                    readOnly: true
                  - name: var-lib-kube-scheduler
                    mountPath: /var/lib/kube-scheduler
                    readOnly: true
                  - name: var-lib-kube-controller-manager
                    mountPath: /var/lib/kube-controller-manager
                    readOnly: true
                  - name: etc-systemd
                    mountPath: /etc/systemd
                    readOnly: true
                  - name: lib-systemd
                    mountPath: /lib/systemd/
                    readOnly: true
                  - name: srv-kubernetes
                    mountPath: /srv/kubernetes/
                    readOnly: true
                  - name: etc-kubernetes
                    mountPath: /etc/kubernetes
                    readOnly: true
                  - name: usr-bin
                    mountPath: /usr/local/mount-from-host/bin
                    readOnly: true
                  - name: etc-cni-netd
                    mountPath: /etc/cni/net.d/
                    readOnly: true
                  - name: opt-cni-bin
                    mountPath: /opt/cni/bin/
                    readOnly: true
                restartPolicy: Never
                volumes:
                - name: var-lib-etcd
                  hostPath:
                    path: "/var/lib/etcd"
                - name: var-lib-kubelet
                  hostPath:
                    path: "/var/lib/kubelet"
                - name: var-lib-kube-scheduler
                  hostPath:
                    path: "/var/lib/kube-scheduler"
                - name: var-lib-kube-controller-manager
                  hostPath:
                    path: "/var/lib/kube-controller-manager"
                - name: etc-systemd
                  hostPath:
                    path: "/etc/systemd"
                - name: lib-systemd
                  hostPath:
                    path: "/lib/systemd"
                - name: srv-kubernetes
                  hostPath:
                    path: "/srv/kubernetes"
                - name: etc-kubernetes
                  hostPath:
                    path: "/etc/kubernetes"
                - name: usr-bin
                  hostPath:
                    path: "/usr/bin"
                - name: etc-cni-netd
                  hostPath:
                    path: "/etc/cni/net.d/"
                - name: opt-cni-bin
                  hostPath:
                    path: "/opt/cni/bin/"
          EOF
          
      - name: Run kube-bench CIS audit
        run: |
          kubectl apply -f kube-bench-job.yaml
          echo "Waiting for kube-bench job to complete..."
          kubectl wait --for=condition=complete job/kube-bench --timeout=300s
          POD_NAME=$(kubectl get pods --selector=job-name=kube-bench --output=jsonpath='{.items[0].metadata.name}')
          echo "kube-bench pod: $POD_NAME"
          kubectl logs $POD_NAME > kube-bench-results.json
        continue-on-error: true
        
      - name: Process and display top 10 CIS benchmark results
        run: |
          if [ -f kube-bench-results.json ]; then
            echo "=== Top 10 CIS Benchmark Results ==="
            echo ""
            
            # Create a script to parse JSON and create table
            cat > parse_results.py << 'EOF'
          import json
          import sys
          import re
          
          def parse_kube_bench_results(filename):
              try:
                  with open(filename, 'r') as f:
                      content = f.read()
                  
                  # Print first few lines to debug
                  print("=== Debug: First 10 lines of output ===")
                  lines = content.split('\n')
                  for i, line in enumerate(lines[:10]):
                      print(f"{i+1}: {line}")
                  print("=== End Debug ===\n")
                  
                  # Try to parse as JSON
                  data = None
                  try:
                      data = json.loads(content)
                  except json.JSONDecodeError:
                      # If not valid JSON, try to extract JSON from mixed output
                      print("Initial JSON parsing failed, trying to extract JSON...")
                      
                      # Look for JSON block in the output
                      json_start = -1
                      json_end = -1
                      brace_count = 0
                      
                      for i, line in enumerate(lines):
                          stripped = line.strip()
                          if stripped.startswith('{') and json_start == -1:
                              json_start = i
                              brace_count = stripped.count('{') - stripped.count('}')
                          elif json_start != -1:
                              brace_count += stripped.count('{') - stripped.count('}')
                              if brace_count == 0:
                                  json_end = i
                                  break
                      
                      if json_start != -1 and json_end != -1:
                          json_content = '\n'.join(lines[json_start:json_end+1])
                          try:
                              data = json.loads(json_content)
                              print("Successfully extracted JSON from mixed output")
                          except json.JSONDecodeError as e:
                              print(f"Failed to parse extracted JSON: {e}")
                      
                      if data is None:
                          print("Could not extract valid JSON, trying line-by-line parsing...")
                          # Last resort: try to find any JSON objects line by line
                          for line in lines:
                              if line.strip().startswith('{'):
                                  try:
                                      data = json.loads(line.strip())
                                      print("Found JSON object in single line")
                                      break
                                  except:
                                      continue
                  
                  if data is None:
                      print("Could not parse JSON from output")
                      return
                  
                  print(f"=== Parsed JSON structure ===")
                  print(f"Top-level keys: {list(data.keys()) if isinstance(data, dict) else 'Not a dict'}")
                  
                  # Extract all test results - handle different kube-bench formats
                  all_results = []
                  
                  # Try different possible structures
                  controls = data.get('Controls', [])
                  if not controls and 'controls' in data:
                      controls = data['controls']
                  
                  for control in controls:
                      print(f"Processing control: {control.get('id', 'unknown')}")
                      
                      tests = control.get('tests', [])
                      if not tests and 'Tests' in control:
                          tests = control['Tests']
                      
                      for test in tests:
                          results = test.get('results', [])
                          if not results and 'Results' in test:
                              results = test['Results']
                          
                          for result in results:
                              # Handle different field names that kube-bench uses
                              test_number = (result.get('test_number') or 
                                           result.get('TestNumber') or 
                                           result.get('id') or 
                                           result.get('test_id') or 'N/A')
                              
                              test_desc = (result.get('test_desc') or 
                                         result.get('TestDesc') or 
                                         result.get('description') or 
                                         result.get('desc') or 'N/A')
                              
                              test_result = (result.get('result') or 
                                           result.get('Result') or 
                                           result.get('status') or 
                                           result.get('Status') or 'UNKNOWN')
                              
                              scored = result.get('scored', result.get('Scored', True))
                              
                              # Determine severity
                              severity = "INFO"
                              if test_result.upper() == 'FAIL':
                                  severity = "HIGH"
                              elif test_result.upper() == 'WARN':
                                  severity = "MEDIUM"
                              elif test_result.upper() == 'PASS':
                                  severity = "LOW"
                              
                              # Truncate description
                              if len(str(test_desc)) > 80:
                                  test_desc = str(test_desc)[:80] + "..."
                              
                              all_results.append({
                                  'test_number': str(test_number),
                                  'test_desc': str(test_desc),
                                  'result': str(test_result).upper(),
                                  'severity': severity,
                                  'scored': scored
                              })
                  
                  print(f"Found {len(all_results)} total test results")
                  
                  if not all_results:
                      print("No test results found in the parsed data")
                      print("Available data structure:")
                      print(json.dumps(data, indent=2)[:1000] + "..." if len(json.dumps(data, indent=2)) > 1000 else json.dumps(data, indent=2))
                      return
                  
                  # Sort by severity (FAIL first, then WARN, then others) and limit to top 10
                  priority_order = {'FAIL': 0, 'WARN': 1, 'PASS': 2, 'INFO': 3, 'UNKNOWN': 4}
                  all_results.sort(key=lambda x: (priority_order.get(x['result'], 5), x['test_number']))
                  top_results = all_results[:10]
                  
                  # Print table header
                  print("\n=== Top 10 CIS Benchmark Results ===")
                  print("| Test # | Result | Severity | Description |")
                  print("|--------|--------|----------|-------------|")
                  
                  # Print top 10 results
                  for result in top_results:
                      test_num = result['test_number'][:8]  # Limit width
                      test_result = result['result'][:6]
                      severity = result['severity'][:8]
                      description = result['test_desc']
                      
                      print(f"| {test_num:<8} | {test_result:<6} | {severity:<8} | {description} |")
                  
                  # Print summary
                  print("\n=== Summary ===")
                  fail_count = sum(1 for r in all_results if r['result'] == 'FAIL')
                  warn_count = sum(1 for r in all_results if r['result'] == 'WARN')
                  pass_count = sum(1 for r in all_results if r['result'] == 'PASS')
                  info_count = sum(1 for r in all_results if r['result'] == 'INFO')
                  unknown_count = sum(1 for r in all_results if r['result'] == 'UNKNOWN')
                  
                  print(f"Total Tests: {len(all_results)}")
                  print(f"Failed: {fail_count}")
                  print(f"Warnings: {warn_count}")
                  print(f"Passed: {pass_count}")
                  print(f"Info: {info_count}")
                  print(f"Unknown: {unknown_count}")
                  
              except Exception as e:
                  print(f"Error parsing results: {str(e)}")
                  import traceback
                  traceback.print_exc()
                  print("\nRaw output (first 50 lines):")
                  try:
                      with open(filename, 'r') as f:
                          lines = f.readlines()
                          for i, line in enumerate(lines[:50]):
                              print(f"{i+1}: {line.rstrip()}")
                  except Exception as file_error:
                      print(f"Could not read file: {file_error}")
          
          if __name__ == "__main__":
              parse_kube_bench_results('kube-bench-results.json')
          EOF
            
            # Run the parser
            python3 parse_results.py
            
          else
            echo "No kube-bench results found"
          fi
          
      - name: Upload CIS Audit Results
        uses: actions/upload-artifact@v4
        with:
          name: kube-bench-cis-results
          path: kube-bench-results.json
          
      - name: Cleanup
        run: kubectl delete job kube-bench --ignore-not-found=true
        if: always()

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full history for better secret detection
        
      - name: Run TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true
        id: trufflehog
        
      - name: Install additional secret scanning tools
        run: |
          # Install gitleaks
          wget -O gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          
          # Install detect-secrets
          pip install detect-secrets
          
      - name: Run Gitleaks scan
        run: |
          echo "=== Running Gitleaks Scan ==="
          gitleaks detect --source . --report-format json --report-path gitleaks-report.json --verbose || echo "Gitleaks found potential secrets"
          
          # Check if secrets were found
          if [ -f gitleaks-report.json ]; then
            SECRET_COUNT=$(jq length gitleaks-report.json 2>/dev/null || echo "0")
            echo "Gitleaks found $SECRET_COUNT potential secrets"
            if [ "$SECRET_COUNT" -gt 0 ]; then
              echo "GITLEAKS_SECRETS_FOUND=true" >> $GITHUB_ENV
            fi
          fi
        continue-on-error: true
        
      - name: Run detect-secrets scan
        run: |
          echo "=== Running detect-secrets Scan ==="
          detect-secrets scan --all-files --baseline .secrets.baseline --force-use-all-plugins || echo "detect-secrets scan completed"
          
          if [ -f .secrets.baseline ]; then
            SECRET_COUNT=$(jq '.results | to_entries | length' .secrets.baseline 2>/dev/null || echo "0")
            echo "detect-secrets found $SECRET_COUNT files with potential secrets"
            if [ "$SECRET_COUNT" -gt 0 ]; then
              echo "DETECT_SECRETS_FOUND=true" >> $GITHUB_ENV
            fi
          fi
        continue-on-error: true
        
      - name: Custom secrets pattern scan
        run: |
          echo "=== Running Custom Pattern Scan ==="
          
          # Create custom secrets scanning script
          cat > custom_secrets_scan.py << 'EOF'
          import os
          import re
          import json
          from pathlib import Path
          
          # Common secret patterns
          SECRET_PATTERNS = {
              'aws_access_key': r'AKIA[0-9A-Z]{16}',
              'aws_secret_key': r'[0-9a-zA-Z/+]{40}',
              'api_key': r'[aA][pP][iI][_]?[kK][eE][yY].*[=:]\s*["\']?([0-9a-zA-Z\-_]{16,})["\']?',
              'password': r'[pP][aA][sS][sS][wW][oO][rR][dD].*[=:]\s*["\']?([^\s"\']{8,})["\']?',
              'secret': r'[sS][eE][cC][rR][eE][tT].*[=:]\s*["\']?([0-9a-zA-Z\-_]{16,})["\']?',
              'token': r'[tT][oO][kK][eE][nN].*[=:]\s*["\']?([0-9a-zA-Z\-_]{16,})["\']?',
              'private_key': r'-----BEGIN.*PRIVATE KEY-----',
              'github_token': r'gh[pousr]_[A-Za-z0-9_]{36}',
              'slack_token': r'xox[baprs]-[0-9a-zA-Z\-]+',
              'discord_token': r'[MN][A-Za-z\d]{23}\.[\w\-]{6}\.[\w\-]{27}',
              'google_api': r'AIza[0-9A-Za-z\-_]{35}',
              'connection_string': r'[sS][eE][rR][vV][eE][rR]=.*[pP][aA][sS][sS][wW][oO][rR][dD]=',
              'jwt_token': r'eyJ[A-Za-z0-9\-_=]+\.eyJ[A-Za-z0-9\-_=]+\.[A-Za-z0-9\-_=]+',
          }
          
          # Files to exclude from scanning
          EXCLUDE_PATTERNS = [
              r'\.git/',
              r'node_modules/',
              r'\.jpg, r'\.png, r'\.gif, r'\.pdf,
              r'\.zip, r'\.tar, r'\.gz,
              r'\.min\.js, r'\.min\.css,
              r'package-lock\.json,
              r'\.secrets\.baseline,
              r'gitleaks-report\.json
          ]
          
          def should_exclude(file_path):
              for pattern in EXCLUDE_PATTERNS:
                  if re.search(pattern, str(file_path)):
                      return True
              return False
          
          def scan_file(file_path):
              findings = []
              try:
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                      
                  for secret_type, pattern in SECRET_PATTERNS.items():
                      matches = re.finditer(pattern, content, re.IGNORECASE | re.MULTILINE)
                      for match in matches:
                          # Get line number
                          line_num = content[:match.start()].count('\n') + 1
                          line_content = content.split('\n')[line_num - 1].strip()
                          
                          # Skip common false positives
                          if any(fp in line_content.lower() for fp in ['example', 'placeholder', 'dummy', 'test', 'fake', 'sample', 'todo', 'xxx']):
                              continue
                          
                          findings.append({
                              'file': str(file_path),
                              'line': line_num,
                              'type': secret_type,
                              'content': line_content[:100] + '...' if len(line_content) > 100 else line_content,
                              'matched_text': match.group(0)[:50] + '...' if len(match.group(0)) > 50 else match.group(0)
                          })
              except Exception as e:
                  print(f"Error scanning {file_path}: {e}")
              
              return findings
          
          def main():
              all_findings = []
              
              for root, dirs, files in os.walk('.'):
                  # Skip hidden directories
                  dirs[:] = [d for d in dirs if not d.startswith('.')]
                  
                  for file in files:
                      file_path = Path(root) / file
                      
                      if should_exclude(file_path):
                          continue
                      
                      findings = scan_file(file_path)
                      all_findings.extend(findings)
              
              # Output results
              if all_findings:
                  print(f"=== Found {len(all_findings)} potential secrets ===")
                  print("| File | Line | Type | Content |")
                  print("|------|------|------|---------|")
                  
                  for finding in all_findings:
                      file_short = finding['file'][:30] + '...' if len(finding['file']) > 30 else finding['file']
                      content_safe = finding['content'].replace('|', '\\|')
                      print(f"| {file_short} | {finding['line']} | {finding['type']} | {content_safe} |")
                  
                  # Save detailed results
                  with open('custom-secrets-report.json', 'w') as f:
                      json.dump(all_findings, f, indent=2)
                      
                  return len(all_findings)
              else:
                  print("No potential secrets found in custom scan")
                  return 0
          
          if __name__ == "__main__":
              secret_count = main()
              exit(1 if secret_count > 0 else 0)
          EOF
          
          python3 custom_secrets_scan.py
          CUSTOM_EXIT_CODE=$?
          
          if [ $CUSTOM_EXIT_CODE -ne 0 ]; then
            echo "CUSTOM_SECRETS_FOUND=true" >> $GITHUB_ENV
          fi
        continue-on-error: true
        
      - name: Generate secrets scan summary
        run: |
          echo "=== Secrets Scanning Summary ==="
          echo ""
          
          SECRETS_FOUND=false
          
          # Check TruffleHog results
          if [ "${{ steps.trufflehog.outcome }}" == "failure" ]; then
            echo "🔍 TruffleHog: SECRETS DETECTED"
            SECRETS_FOUND=true
          else
            echo "✅ TruffleHog: No verified secrets found"
          fi
          
          # Check Gitleaks results
          if [ "$GITLEAKS_SECRETS_FOUND" == "true" ]; then
            echo "🔍 Gitleaks: SECRETS DETECTED"
            SECRETS_FOUND=true
            if [ -f gitleaks-report.json ]; then
              echo "Gitleaks findings:"
              jq -r '.[] | "  - \(.File):\(.StartLine) - \(.Description)"' gitleaks-report.json | head -10
            fi
          else
            echo "✅ Gitleaks: No secrets found"
          fi
          
          # Check detect-secrets results
          if [ "$DETECT_SECRETS_FOUND" == "true" ]; then
            echo "🔍 detect-secrets: POTENTIAL SECRETS DETECTED"
            SECRETS_FOUND=true
          else
            echo "✅ detect-secrets: No secrets found"
          fi
          
          # Check custom scan results
          if [ "$CUSTOM_SECRETS_FOUND" == "true" ]; then
            echo "🔍 Custom Scan: POTENTIAL SECRETS DETECTED"
            SECRETS_FOUND=true
          else
            echo "✅ Custom Scan: No secrets found"
          fi
          
          echo ""
          if [ "$SECRETS_FOUND" == "true" ]; then
            echo "❌ SECRETS DETECTED: Please review and remove any hardcoded secrets before proceeding."
            echo "🔒 Security recommendations:"
            echo "   - Use environment variables or secret management services"
            echo "   - Add sensitive files to .gitignore"
            echo "   - Consider using tools like Azure Key Vault, AWS Secrets Manager, or HashiCorp Vault"
            echo "   - Review the uploaded artifacts for detailed findings"
            exit 1
          else
            echo "✅ No secrets detected in any scans"
          fi
        
      - name: Upload secrets scan results
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: |
            gitleaks-report.json
            .secrets.baseline
            custom-secrets-report.json
        if: always()
