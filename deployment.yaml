apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-tasky
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskyfabrizia
  template:
    metadata:
      labels:
        app: taskyfabrizia
    spec:
      containers:
      - name: taskyfabrizia
        image: fabwiziaregistryi5eh.azurecr.io/fabriziav/taskyfabrizia:latest
        ports:
        - containerPort: 8080
        env:
        - name: MONGODB_URI
          value: "mongodb://192.168.10.4:27017/go-mongodb"
        - name: SECRET_KEY
          value: "secret123"
---
apiVersion: v1
kind: Service
metadata:
  name: tasky-fabrizia-service
spec:
  type: LoadBalancer
  selector:
    app: taskyfabrizia
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
